<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><rect x="0" y="0" width="1600" height="920" rx="0" fill="#0F1114" opacity="1"/><text x="80" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Etsy payment processing rates, by seller country</text><text x="80" y="130" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">Two of the ten markets we cover charge a higher rate on international orders — a full extra point on every foreign sale.</text><text x="80" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E6C66" text-anchor="start" letter-spacing="2">COUNTRY</text><text x="700" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E6C66" text-anchor="start" letter-spacing="2">DOMESTIC</text><text x="1120" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E6C66" text-anchor="start" letter-spacing="2">INTERNATIONAL</text><line x1="80" y1="228" x2="1520" y2="228" stroke="#24282E" stroke-width="1"/><text x="100" y="308" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">United States</text><text x="700" y="308" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">3.0% + $0.25</text><text x="1120" y="308" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">same rate</text><text x="100" y="426" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">United Kingdom</text><text x="700" y="426" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">4.0% + £0.20</text><text x="1120" y="426" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">same rate</text><text x="100" y="544" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">EU — DE · FR · IT · ES · NL · IE</text><text x="700" y="544" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">4.0% + €0.30</text><text x="1120" y="544" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">same rate</text><rect x="60" y="600" width="1480" height="104" rx="10" fill="#141F1B" opacity="1"/><rect x="60" y="600" width="6" height="104" rx="3" fill="#5DCAA5" opacity="1"/><text x="100" y="662" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Canada</text><text x="700" y="662" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">3.0% + C$0.25</text><text x="1120" y="662" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">4.0% + C$0.25</text><rect x="60" y="718" width="1480" height="104" rx="10" fill="#141F1B" opacity="1"/><rect x="60" y="718" width="6" height="104" rx="3" fill="#5DCAA5" opacity="1"/><text x="100" y="780" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Australia</text><text x="700" y="780" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">3.0% + A$0.25</text><text x="1120" y="780" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">4.0% + A$0.25</text><text x="80" y="866" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6E6C66" text-anchor="start" letter-spacing="0">Charged on item + shipping + gift wrap + sales tax — the only Etsy fee whose base includes the tax the buyer pays.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0F1114" opacity="1"/><text x="80" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Where your Etsy money goes</text><text x="80" y="130" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">One order, three different bases. Applying the right rate to the wrong amount is the most common Etsy fee-calculator error.</text><rect x="80" y="176" width="720" height="88" rx="6" fill="#16211D" opacity="1" stroke="#5DCAA5" stroke-width="2"/><text x="440.0" y="229.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#E8E6E1" text-anchor="middle" letter-spacing="0">Item price</text><rect x="800" y="176" width="200" height="88" rx="6" fill="#14181C" opacity="1" stroke="#24282E" stroke-width="2"/><text x="900.0" y="229.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#E8E6E1" text-anchor="middle" letter-spacing="0">Shipping</text><rect x="1000" y="176" width="160" height="88" rx="6" fill="#14181C" opacity="1" stroke="#24282E" stroke-width="2"/><text x="1080.0" y="229.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#E8E6E1" text-anchor="middle" letter-spacing="0">Gift wrap</text><rect x="1160" y="176" width="360" height="88" rx="6" fill="#241A1A" opacity="1" stroke="#5A3A36" stroke-width="2"/><text x="1340.0" y="229.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#D9736C" text-anchor="middle" letter-spacing="0">Sales tax</text><text x="1340" y="294" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#D9736C" text-anchor="middle" letter-spacing="0">not your revenue</text><text x="80" y="338" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Transaction fee</text><text x="80" y="368" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">6.5%</text><rect x="761.0" y="318" width="378.0" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1141.0" y="318" width="103.55555555555566" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1246.5555555555557" y="318" width="82.44444444444434" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1331.0" y="318" width="188.0" height="34" rx="4" fill="none" opacity="1" stroke="#24282E" stroke-width="2"/><text x="760" y="376" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">item + shipping + gift wrap  (sales tax excluded)</text><text x="80" y="454" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Payment processing</text><text x="80" y="484" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">3% – 4% + fixed</text><rect x="761.0" y="434" width="378.0" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1141.0" y="434" width="103.55555555555566" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1246.5555555555557" y="434" width="82.44444444444434" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1331.0" y="434" width="188.0" height="34" rx="4" fill="#2F6B58" opacity="1"/><text x="760" y="492" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">item + shipping + gift wrap + sales tax  (the only base that includes tax)</text><text x="80" y="570" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Regulatory operating fee</text><text x="80" y="600" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">0% – 1.14%</text><rect x="761.0" y="550" width="378.0" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1141.0" y="550" width="103.55555555555566" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1246.5555555555557" y="550" width="82.44444444444434" height="34" rx="4" fill="#2F6B58" opacity="1"/><rect x="1331.0" y="550" width="188.0" height="34" rx="4" fill="none" opacity="1" stroke="#24282E" stroke-width="2"/><text x="760" y="608" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">same base as the transaction fee — excluded in most countries</text><text x="80" y="686" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Offsite Ads</text><text x="80" y="716" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">15% / 12%</text><rect x="761.0" y="666" width="378.0" height="34" rx="4" fill="#6B5A2A" opacity="1"/><rect x="1141.0" y="666" width="103.55555555555566" height="34" rx="4" fill="#6B5A2A" opacity="1"/><rect x="1246.5555555555557" y="666" width="82.44444444444434" height="34" rx="4" fill="#6B5A2A" opacity="1"/><rect x="1331.0" y="666" width="188.0" height="34" rx="4" fill="#6B5A2A" opacity="1"/><text x="760" y="724" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">the whole order total, then capped per order</text><text x="80" y="856" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6E6C66" text-anchor="start" letter-spacing="0">Rates as published by Etsy in 2026. Every figure on this site is derived from the bases shown above.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><rect x="0" y="0" width="1600" height="880" rx="0" fill="#0F1114" opacity="1"/><text x="80" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Etsy's regulatory operating fee, by country</text><text x="80" y="130" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">Charged on the same base as the transaction fee: order total excluding sales tax. Five of the ten markets we cover charge it.</text><text x="380" y="263" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#E8E6E1" text-anchor="end" letter-spacing="0">France</text><rect x="410" y="236" width="880.0" height="38" rx="5" fill="#16211D" opacity="1" stroke="#5DCAA5" stroke-width="2"/><text x="1308.0" y="264" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">1.14%</text><text x="380" y="345" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#E8E6E1" text-anchor="end" letter-spacing="0">Spain</text><rect x="410" y="318" width="679.2982456140352" height="38" rx="5" fill="#16211D" opacity="1" stroke="#5DCAA5" stroke-width="2"/><text x="1107.2982456140353" y="346" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">0.88%</text><text x="380" y="427" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#E8E6E1" text-anchor="end" letter-spacing="0">Italy</text><rect x="410" y="400" width="617.5438596491229" height="38" rx="5" fill="#16211D" opacity="1" stroke="#5DCAA5" stroke-width="2"/><text x="1045.5438596491229" y="428" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">0.80%</text><text x="380" y="509" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#E8E6E1" text-anchor="end" letter-spacing="0">Canada</text><rect x="410" y="482" width="385.9649122807018" height="38" rx="5" fill="#16211D" opacity="1" stroke="#5DCAA5" stroke-width="2"/><text x="813.9649122807018" y="510" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">0.50%</text><text x="380" y="591" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#E8E6E1" text-anchor="end" letter-spacing="0">United Kingdom</text><rect x="410" y="564" width="370.5263157894737" height="38" rx="5" fill="#16211D" opacity="1" stroke="#5DCAA5" stroke-width="2"/><text x="798.5263157894738" y="592" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">0.48%</text><rect x="80" y="664" width="1440" height="104" rx="12" fill="#14181C" opacity="1" stroke="#24282E" stroke-width="2"/><text x="116" y="706" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">No regulatory operating fee:</text><text x="116" y="746" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">United States · Germany · Australia · Netherlands · Ireland</text><text x="80" y="826" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6E6C66" text-anchor="start" letter-spacing="0">Etsy reset these rates on 22 June 2026 — anything published before that date is out of date. Source: Etsy's Fees &amp; Payments Policy.</text></svg>
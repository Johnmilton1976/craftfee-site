<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><rect x="0" y="0" width="1600" height="880" rx="0" fill="#0F1114" opacity="1"/><text x="80" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Refunding an Etsy order: which fees come back</text><text x="80" y="130" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">Miss the second step and you donate fees on a sale that no longer exists.</text><text x="80" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E6C66" text-anchor="start" letter-spacing="2">FEE</text><text x="860" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E6C66" text-anchor="start" letter-spacing="2">REFUND ONLY</text><text x="1220" y="208" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E6C66" text-anchor="start" letter-spacing="2">REFUND + CANCEL ORDER</text><line x1="80" y1="228" x2="1520" y2="228" stroke="#24282E" stroke-width="1"/><text x="80" y="294" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Transaction fee — 6.5%</text><text x="860" y="294" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">Comes back</text><text x="1220" y="294" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">Comes back</text><line x1="80" y1="330" x2="1520" y2="330" stroke="#1B1F24" stroke-width="1"/><text x="80" y="398" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Payment processing — 3–4% + fixed</text><text x="860" y="398" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">Comes back</text><text x="1220" y="398" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">Comes back</text><line x1="80" y1="434" x2="1520" y2="434" stroke="#1B1F24" stroke-width="1"/><text x="80" y="502" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Listing fee — US$0.20</text><text x="860" y="502" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#D9736C" text-anchor="start" letter-spacing="0">Does not come back</text><text x="1220" y="502" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#5DCAA5" text-anchor="start" letter-spacing="0">Comes back</text><line x1="80" y1="538" x2="1520" y2="538" stroke="#1B1F24" stroke-width="1"/><text x="80" y="606" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Offsite Ads — 15% / 12%</text><text x="860" y="606" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#D9736C" text-anchor="start" letter-spacing="0">Does not come back</text><text x="1220" y="606" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#D9736C" text-anchor="start" letter-spacing="0">Never comes back</text><line x1="80" y1="642" x2="1520" y2="642" stroke="#1B1F24" stroke-width="1"/><rect x="80" y="676" width="1440" height="130" rx="12" fill="#14181C" opacity="1" stroke="#24282E" stroke-width="2"/><text x="116" y="720" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">Etsy's help centre, “How to Cancel a Sale”:</text><text x="116" y="758" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">"Your Etsy transaction and processing fees for the refunded transactions</text><text x="116" y="790" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">are automatically refunded to your Payment account."</text><text x="80" y="852" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6E6C66" text-anchor="start" letter-spacing="0">Automatic, for the refunded amount. No form, no request, and no 48-hour window — that claim comes from misreading Etsy's case system.</text></svg>
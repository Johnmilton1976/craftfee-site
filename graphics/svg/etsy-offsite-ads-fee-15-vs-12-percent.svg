<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><rect x="0" y="0" width="1600" height="920" rx="0" fill="#0F1114" opacity="1"/><text x="80" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Etsy Offsite Ads: 15% or 12%, and the per-order cap</text><text x="80" y="130" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">Charged on the whole order total — before shipping, tax and every other fee are taken out.</text><rect x="80" y="184" width="700" height="232" rx="12" fill="#14181C" opacity="1" stroke="#24282E" stroke-width="2"/><text x="116" y="242" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Under US$10,000</text><text x="116" y="280" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">in any consecutive 365-day period</text><text x="116" y="366" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">15%</text><text x="320" y="366" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">You can opt out.</text><rect x="820" y="184" width="700" height="232" rx="12" fill="#14181C" opacity="1" stroke="#5DCAA5" stroke-width="2"/><text x="856" y="242" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">US$10,000 or more</text><text x="856" y="280" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">reached at any point in the shop's life</text><text x="856" y="366" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">12%</text><text x="1030" y="366" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Mandatory for the shop's life.</text><rect x="80" y="454" width="1440" height="96" rx="12" fill="#14181C" opacity="1" stroke="#24282E" stroke-width="2"/><text x="116" y="512" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8E6E1" text-anchor="start" letter-spacing="0">Per-order cap</text><text x="420" y="514" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#5DCAA5" text-anchor="start" letter-spacing="0">US$100  ·  £80  ·  C$140  ·  A$140  ·  €92</text><rect x="80" y="588" width="1440" height="152" rx="12" fill="#14181C" opacity="1" stroke="#24282E" stroke-width="2"/><text x="116" y="636" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">A $38 order × 15% = $5.70 — the cap never binds. The cap only starts to matter</text><text x="116" y="674" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#E8E6E1" text-anchor="start" letter-spacing="0">above roughly $667 at 15%, or $833 at 12%.</text><text x="116" y="718" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#9A9891" text-anchor="start" letter-spacing="0">Only orders Etsy attributes to an ad are charged; the rest cost you nothing.</text><text x="80" y="830" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6E6C66" text-anchor="start" letter-spacing="0">Source: Etsy's Advertising &amp; Marketing Policy, 2026. Opt-out eligibility is based on lifetime sales in any 365-day window.</text></svg>